name: '🐛 Bug Report'
description: Report a problem with the Cloudflare edition.
body:
  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Environment
      description: Where did the problem occur?
      options:
        - Cloudflare Workers with remote D1
        - Local Worker preview with local D1
        - vinext development server with local D1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant log output
      description: Include relevant browser or Worker logs. Remove passwords, tokens, cookies, and personal visitor data first.
      render: shell
  - type: input
    attributes:
      label: Which commit are you running?
      description: Run git rev-parse --short HEAD, or provide the Worker version ID.
  - type: input
    attributes:
      label: Which browser are you using?
      description: 'For example: Chrome, Edge, Firefox, etc'
